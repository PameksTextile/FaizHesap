<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredi Ödeme Planı Hesaplayıcı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <div class="max-w-6xl mx-auto px-4 pt-8">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6 border border-gray-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Banka Uyumlu Kredi Hesaplama</h1>
                <p class="text-slate-500 text-sm italic">Ticari Krediler İçin 30/360 Ödeme Planı Simülasyonu</p>
            </div>
            <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700 no-print">Yazdır / PDF</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- Parametre Girişi -->
            <div class="lg:col-span-1 space-y-6 no-print">
                <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2 text-blue-700">Kredi Detayları</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase">Kredi Tutarı</label>
                            <input type="number" id="loanAmount" value="420000" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase">Vade Başlangıcı</label>
                            <input type="date" id="startDate" value="2026-02-04" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase">Aylık Faiz (%)</label>
                            <input type="number" id="monthlyInterest" value="0.49" step="0.0001" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase">Ödeme Sıklığı (Ay)</label>
                            <select id="paymentFrequency" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md">
                                <option value="1">Aylık</option>
                                <option value="3" selected>3 Ayda Bir</option>
                                <option value="6">6 Ayda Bir</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase">Taksit Sayısı</label>
                            <input type="number" id="installments" value="4" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase">BSMV (%)</label>
                                <input type="number" id="bsmv" value="0" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase">KKDF (%)</label>
                                <input type="number" id="kkdf" value="0" class="mt-1 block w-full p-2 bg-slate-50 border border-gray-300 rounded-md">
                            </div>
                        </div>
                        <button onclick="calculate()" class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg hover:bg-blue-800 shadow-lg transition-all">HESAPLA</button>
                    </div>
                </div>
            </div>

            <!-- Sonuçlar -->
            <div class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Taksit Tutarı</p>
                        <p id="sumTaksit" class="text-xl font-bold text-slate-800">-</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Toplam Faiz</p>
                        <p id="sumFaiz" class="text-xl font-bold text-blue-600">-</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Vergi/Fon</p>
                        <p id="sumVergi" class="text-xl font-bold text-red-500">-</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <p class="text-[10px] text-gray-400 uppercase font-bold">Toplam Ödeme</p>
                        <p id="sumToplam" class="text-xl font-bold text-green-700">-</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-800 text-white uppercase text-[11px] tracking-wider">
                            <tr>
                                <th class="px-4 py-4">No</th>
                                <th class="px-4 py-4">Vade Tarihi</th>
                                <th class="px-4 py-4 text-right">Anapara</th>
                                <th class="px-4 py-4 text-right">Faiz</th>
                                <th class="px-4 py-4 text-right">Vergi/Fon</th>
                                <th class="px-4 py-4 text-right font-bold">Taksit Tutarı</th>
                                <th class="px-4 py-4 text-right">Kalan Anapara</th>
                            </tr>
                        </thead>
                        <tbody id="resultTable" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fmt(n) {
            return new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
        }

        function calculate() {
            const anaParaInput = parseFloat(document.getElementById('loanAmount').value);
            const aylikFaizOrani = parseFloat(document.getElementById('monthlyInterest').value) / 100;
            const frekansAy = parseInt(document.getElementById('paymentFrequency').value);
            const taksitSayisi = parseInt(document.getElementById('installments').value);
            const bsmv = parseFloat(document.getElementById('bsmv').value) / 100;
            const kkdf = parseFloat(document.getElementById('kkdf').value) / 100;
            const baslangicTarihi = new Date(document.getElementById('startDate').value);

            // 1. Periyot Faizi (Banka 3 aylık faizi böyle hesaplar)
            const i = aylikFaizOrani * frekansAy;
            const vergiCarpani = 1 + bsmv + kkdf;
            const i_vergi = i * vergiCarpani;

            // 2. Taksit Tutarı Formülü (PMT): T = P * [ i / (1 - (1+i)^-n) ]
            // Bu formül bankaların kullandığı standart eşit taksit formülüdür.
            let taksit = anaParaInput * (i_vergi / (1 - Math.pow(1 + i_vergi, -taksitSayisi)));
            taksit = Math.round(taksit * 100) / 100; // Banka yuvarlaması

            const tbody = document.getElementById('resultTable');
            tbody.innerHTML = '';

            let kalanAnaPara = anaParaInput;
            let topFaiz = 0, topVergi = 0, topOdeme = 0;

            for (let k = 1; k <= taksitSayisi; k++) {
                // Faiz Hesabı (Kalan üzerinden)
                let donemFaizi = Math.round((kalanAnaPara * i) * 100) / 100;
                let donemVergisi = Math.round((donemFaizi * (bsmv + kkdf)) * 100) / 100;
                
                let donemAnaPara;
                let donemTaksit;

                if (k === taksitSayisi) {
                    // Son taksit sıfırlama
                    donemAnaPara = kalanAnaPara;
                    donemTaksit = donemAnaPara + donemFaizi + donemVergisi;
                } else {
                    donemAnaPara = Math.round((taksit - donemFaizi - donemVergisi) * 100) / 100;
                    donemTaksit = taksit;
                }

                kalanAnaPara = Math.round((kalanAnaPara - donemAnaPara) * 100) / 100;
                
                topFaiz += donemFaizi;
                topVergi += donemVergisi;
                topOdeme += donemTaksit;

                let vade = new Date(baslangicTarihi);
                vade.setMonth(vade.getMonth() + (k * frekansAy));

                tbody.innerHTML += `
                    <tr class="hover:bg-blue-50 transition">
                        <td class="px-4 py-3 font-bold text-gray-400">${k}</td>
                        <td class="px-4 py-3">${vade.toLocaleDateString('tr-TR')}</td>
                        <td class="px-4 py-3 text-right font-mono">${fmt(donemAnaPara)}</td>
                        <td class="px-4 py-3 text-right font-mono text-blue-600">${fmt(donemFaizi)}</td>
                        <td class="px-4 py-3 text-right font-mono text-red-500">${fmt(donemVergisi)}</td>
                        <td class="px-4 py-3 text-right font-bold font-mono text-slate-800">${fmt(donemTaksit)}</td>
                        <td class="px-4 py-3 text-right font-mono text-slate-400">${fmt(Math.max(0, kalanAnaPara))}</td>
                    </tr>
                `;
            }

            document.getElementById('sumTaksit').innerText = fmt(taksit);
            document.getElementById('sumFaiz').innerText = fmt(topFaiz);
            document.getElementById('sumVergi').innerText = fmt(topVergi);
            document.getElementById('sumToplam').innerText = fmt(topOdeme);
        }

        window.onload = calculate;
    </script>
</body>
</html>
